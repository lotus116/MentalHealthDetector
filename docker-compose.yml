name: mh-support

services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  ui:
    build: .
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "ui/streamlit_app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
      ]
    ports:
      - "8501:8501"
    depends_on:
      - api
